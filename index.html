<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WS Outreach Plan</title>
<style>
:root{--bg:#fbfbfa;--fg:#1d1d1b;--mute:#6b6b66;--line:#e4e4df;--acc:#3b4cca;--chip:#efefea}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--fg:#ececea;--mute:#9a9a94;--line:#2e2e2b;--acc:#8d9bff;--chip:#22221f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{padding:20px 16px 0;max-width:880px;margin:0 auto}h1{font-size:22px;margin:0 0 4px}header p{margin:0;color:var(--mute);font-size:14px}
nav{display:flex;gap:8px;overflow-x:auto;padding:14px 16px;max-width:880px;margin:0 auto;position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line)}
nav button{border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:7px 12px;border-radius:999px;font-size:14px;white-space:nowrap;cursor:pointer}
nav button[aria-selected=true]{background:var(--acc);color:#fff;border-color:var(--acc)}
main{max-width:880px;margin:0 auto;padding:8px 16px 60px}main h1{font-size:20px}main h2{font-size:18px;margin-top:28px}main h3{font-size:16px}
table{border-collapse:collapse;width:100%;display:block;overflow-x:auto;font-size:14px}th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}th{background:var(--chip)}
code,pre{font:13px ui-monospace,Menlo,monospace;background:var(--chip);border-radius:4px}code{padding:1px 4px}pre{padding:10px;overflow-x:auto}pre code{padding:0}
a{color:var(--acc)}
</style></head><body>
<header><h1>Winning Statics outreach plan</h1><p>Spec of record for the 6.5k-store campaign · updated 22 Oct 2026</p></header>
<nav role="tablist"></nav><main id="doc">Loading…</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
const docs=[["DECISIONS","Decisions"],["COPY","Copy"],["RULEBOOK","Rulebook"],["CONTRACT","WS ↔ Closefast"],["FAQ","Doubts"]];
const nav=document.querySelector('nav'),main=document.getElementById('doc');
async function show(k){[...nav.children].forEach(b=>b.setAttribute('aria-selected',b.dataset.k===k));
 try{const t=await (await fetch(k+'.md',{cache:'no-store'})).text();main.innerHTML=marked.parse(t);}catch(e){main.textContent='Could not load '+k;}
 try{history.replaceState(null,'','#'+k)}catch(e){}}
docs.forEach(([k,l])=>{const b=document.createElement('button');b.textContent=l;b.dataset.k=k;b.setAttribute('role','tab');b.onclick=()=>show(k);nav.appendChild(b)});
show((location.hash||'').slice(1)&&docs.some(d=>d[0]===location.hash.slice(1))?location.hash.slice(1):'DECISIONS');
</script></body></html>
